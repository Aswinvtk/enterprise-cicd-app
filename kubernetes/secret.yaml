# ==========================================
# Secret Configuration for Sensitive Application Credentials
# ==========================================
# CAUTION: In real production environments, do NOT commit secrets to Git.
# Use GitOps-friendly solutions like SealedSecrets, AWS Secrets Manager, 
# HashiCorp Vault, or External Secrets Operator.
# ==========================================
apiVersion: v1
kind: Secret

metadata:
  name: enterprise-secret
  namespace: enterprise-cicd
  labels:
    project: enterprise-cicd

# Opaque type indicates arbitrary user-defined data
type: Opaque

# stringData permits writing plain text values which are converted to base64
# encoding automatically when applied to the Kubernetes cluster.
stringData:
  DB_USERNAME: admin
  DB_PASSWORD: password123
  JWT_SECRET: enterprise-secret-key-32-chars-long-or-more
